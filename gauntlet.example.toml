# Example fleet config for `gauntlet run -c gauntlet.toml`.

# Hosts: bare strings or tables with labels. Must appear before any [table]
# header (top-level TOML key). `data_addr` points pairwise network tests at
# a data-plane NIC when ssh rides a management network.
hosts = [
    "10.0.0.1",
    "10.0.0.2",
    { addr = "10.0.0.3", data_addr = "10.1.1.3", labels = { rack = "r2", role = "trainer" } },
]

[ssh]
# user = "ubuntu"              # default: ~/.ssh/config resolution
# key = "~/.ssh/id_ed25519"
remote_dir = "~/.gauntlet"
connect_timeout_secs = 10
max_concurrent = 32

[tests]
# "overlap" (GEMM concurrent with intra-node all-reduce) runs last: its
# retention ratios divide the isolated gpu-phase baselines from this run.
phases = ["inventory", "cpu_mem", "gpu", "network", "overlap"]
phase_timeout_secs = 900
gemm_secs = 30
gemm_dim = 8192
gemm_dtypes = ["f32", "bf16", "f16"]
# Hot SDC screens: correctness checked *under* thermal load. 0 disables.
gemm_sdc_check_secs = 5      # loaded secs between bitwise checks in the sustained GEMM
cpu_sdc_hot_secs = 10        # all-core correctness-under-power screen duration
disk_paths = ["/tmp"]
net_port_base = 29500
# NCCL message-size sweeps (network phase). Default sizes: 1 KiB .. 1 GiB.
# nccl_sizes = [1024, 1048576, 1073741824]
nccl_iters_per_size = 20
# Intra-node level of the hierarchy: all-reduce + all-gather across every
# local GPU (single process, NVLink/PCIe), run before the pairwise and fleet
# levels. Same sizes/iterations as the fleet sweep. Nodes with < 2 GPUs skip.
nccl_intranode = true
# Barrier-skew microbenchmark: iterations of a tiny collective, timed
# per rank to find hosts that consistently arrive late. 0 disables.
barrier_iters = 2000
barrier_bytes = 8
overlap_secs = 30            # combined GEMM + all-reduce window
overlap_baseline_secs = 5    # isolated all-reduce baseline (intra-node and fleet steps)
overlap_msg_mib = 64         # all-reduce message size
overlap_fleet = true         # fleet-wide combined-load step (needs >= 2 GPU hosts)

[thresholds]
mad_k = 4.0
# Flag a host as a barrier straggler when it was the late arriver in more
# than this fraction of the margin-passing iterations.
barrier_slowest_frac = 0.5
# gpu_idle (inventory): fail a GPU whose memory use exceeds this many MiB
# before the run starts. Any foreign compute process fails it regardless;
# the headroom covers graphics clients (Xorg etc.) and driver residue.
gpu_idle_max_used_mib = 1024
# Optional absolute floors/ceilings, keyed "<test>.<metric>":
# [thresholds.absolute."gpu_gemm_perf.gflops_bf16"]
# min = 500000.0

[nccl]
# socket_ifname = "eth0"       # NCCL_SOCKET_IFNAME for multi-homed nodes
# Extra NCCL knobs, set on the command line of every agent process (so
# every communicator — fleet sweep, barrier, both overlap steps — sees
# them) and recorded in the results. Keys must match ^NCCL_[A-Z0-9_]+$
# (no LD_PRELOAD etc.). Values are strings, integers or booleans
# (true/false -> 1/0), non-empty and single-line. Set NCCL_SOCKET_IFNAME
# here or via socket_ifname, not both.
# env = { NCCL_IB_HCA = "mlx5_0,mlx5_1", NCCL_IB_GID_INDEX = 3 }
#
# Transport capture: every NCCL-hosting agent process is also started with
# NCCL_DEBUG=INFO, NCCL_DEBUG_SUBSYS=INIT,NET and
# NCCL_DEBUG_FILE=<remote_dir>/nccl-logs/<level>.%h.log, and the run records
# which transport each communicator used (IB/RoCE ports, socket interfaces,
# net plugin, P2P/SHM/NET peer channels). A multi-host communicator on TCP
# sockets is flagged only on hosts with an ACTIVE IB/RoCE port (an
# Ethernet-only fleet is fine) and unless that level sets
# NCCL_IB_DISABLE=1 or NCCL_NET=Socket. Debug variables set here are never
# overridden; an NCCL_DEBUG below INFO, or an NCCL_DEBUG_SUBSYS without
# INIT, turns capture off (recorded as unknown).

# Per-level overrides, layered on top of [nccl] env for one NCCL call site
# only (same key/value rules). Levels: intranode (intra-node sweep), fleet
# (fleet sweep), barrier (NCCL barrier-skew probe), overlap_intranode
# (node-local overlap step), overlap_fleet (fleet overlap step). When the
# barrier's effective env differs from the fleet's, the probe runs on its
# own communicator instead of riding the fleet sweep's.
# [nccl.levels.intranode]
# env = { NCCL_ALGO = "Ring" }                          # force Ring on NVLink only
# [nccl.levels.fleet]
# env = { NCCL_P2P_DISABLE = 1, NCCL_SHM_DISABLE = 1 }  # push every hop through the NICs
