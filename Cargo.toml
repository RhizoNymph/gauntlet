[package]
name = "gauntlet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive"] }
comfy-table = "=7.2.2"
core_affinity = "=0.8.3"
cudarc = { version = "=0.19.8", optional = true, default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "nccl",
    "dynamic-loading",
    # API baseline; libs are still dlopened at runtime. Bump if the fleet
    # runs an older driver stack than CUDA 12.4.
    "cuda-12040",
] }
libc = "=0.2.189"
openssh = { version = "=0.11.6", features = ["native-mux"] }
openssh-sftp-client = "=0.15.7"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process", "io-util"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[features]
default = ["gpu"]
gpu = ["dep:cudarc"]

[profile.release]
lto = true
codegen-units = 1
